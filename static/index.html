<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Copilot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Study Copilot</h1>
    <p>Ανέβασε τις διαφάνειες μιας διάλεξης και πάρε περίληψη, flashcards και quiz.</p>
  </header>

  <main>
    <form id="upload-form">
      <label for="pdf">Διάλεξη σε PDF (έως 20 MB)</label>
      <input id="pdf" name="pdf" type="file" accept="application/pdf" required>
      <button type="submit" id="submit">Φτιάξε υλικό μελέτης</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="results" hidden>
      <div role="tablist" aria-label="Υλικό μελέτης" id="tabs"></div>
      <div id="panels"></div>
    </section>
  </main>

  <footer>GDG on Campus AUTH · Antigravity 101</footer>
  <script src="app.js"></script>
</body>
</html>
